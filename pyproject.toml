[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-ladder"
version = "0.1.0"
description = "Detector de arbitragem de escada em mercados de temperatura da Polymarket (fase de coleta de dados, sem execucao de ordens)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
